[package]
name = "refineforge-trainer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "refineforge: training-experiment orchestration (Section 2 phase 1+). Wraps any training backend (axolotl, HuggingFace Trainer, custom) with run-tracking, checkpoint resume, failure recovery, and JSON reports. Does NOT perform training itself."

[[bin]]
name = "refine-train"
path = "src/main.rs"

[dependencies]
anyhow      = "1.0"
clap        = { version = "4.5", features = ["derive"] }
serde       = { version = "1.0", features = ["derive"] }
serde_yaml  = "0.9"
serde_json  = "1.0"
chrono      = { version = "0.4", features = ["serde"] }
regex       = "1.10"
walkdir     = "2.5"

[dev-dependencies]
tempfile    = "3"
