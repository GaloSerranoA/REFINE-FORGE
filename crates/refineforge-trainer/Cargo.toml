[package]
name = "refineforge-trainer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "refineforge: training control plane with a native proof-repair smoke trainer plus external backend orchestration, checkpointing, recovery, promotion, and JSON reports."

[[bin]]
name = "refine-train"
path = "src/main.rs"

[dependencies]
anyhow                  = "1.0"
clap                    = { version = "4.5", features = ["derive"] }
serde                   = { version = "1.0", features = ["derive"] }
serde_yaml              = "0.9"
serde_json              = "1.0"
chrono                  = { version = "0.4", features = ["serde"] }
regex                   = "1.10"
walkdir                 = "2.5"
sha2                    = "0.10"
zstd                    = "0.13"
refineforge-repair-api  = { path = "../refineforge-repair-api" }
# CPU-only by default (no cudarc); the `cuda` feature enables the GPU GPT backend.
refineforge-gpu         = { path = "../refineforge-gpu" }

[features]
default = []
# Enable the device-resident GPU GPT backend (`refineforge_native_gpt_cuda`).
# Pulls refineforge-gpu's CUDA path (cudarc + nvrtc); requires an NVIDIA GPU.
cuda = ["refineforge-gpu/cuda"]

[dev-dependencies]
tempfile    = "3"
