[package]
name = "refineforge-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "refineforge: repair-loop evaluation harness (Section 2)"

[[bin]]
name = "refine-eval"
path = "src/main.rs"

[dependencies]
refineforge-cli         = { path = "../refineforge-cli" }
refineforge-repair-api  = { path = "../refineforge-repair-api" }
refineforge-strategies  = { path = "../refineforge-strategies" }
anyhow                  = "1.0"
clap                    = { version = "4.5", features = ["derive"] }
serde                   = { version = "1.0", features = ["derive"] }
serde_json              = "1.0"
chrono                  = { version = "0.4", features = ["serde"] }
walkdir                 = "2.5"
tempfile                = "3"

[dev-dependencies]
tempfile                = "3"
