[package]
name = "refineforge-strategies"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "refineforge: pluggable RepairStrategy implementations (Section 2)"

[lib]
name = "refineforge_strategies"
path = "src/lib.rs"

[dependencies]
# We depend on the API crate, NOT on refineforge-cli. This breaks the
# cycle: cli depends on us; we depend only on the api crate.
refineforge-repair-api = { path = "../refineforge-repair-api" }
anyhow                 = "1.0"
serde                  = { version = "1.0", features = ["derive"] }
serde_json             = "1.0"
# Real HTTP transport for the Anthropic API. Blocking client to
# match the sync RepairStrategy trait. `rustls-tls` to avoid the
# OpenSSL system-library dependency on Linux/macOS.
reqwest                = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
# In-process HTTP server for transport tests (retry, error mapping).
tiny_http              = "0.12"
