# Real fine-tuning lane config for the Mathlib proof-repair corpus.
#
# This is intentionally pointed at the finalized Anthropic-generated
# training split for `training/data/mathlib-proof-repair-v1`.

id: 2026-05-20-qwen-1.5b-mathlib-proof-repair-anthropic

description: |
  LoRA/QLoRA run for Qwen2.5-Coder-1.5B on the Mathlib proof-repair SFT
  rows generated by Anthropic from the real Mathlib mutation corpus. The
  finalized SFT manifest contains 1000 rows with an 800/100/100 split.

base_model:
  name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  source: huggingface

dataset:
  path: training/data/mathlib-proof-repair-v1/anthropic-sft.train.jsonl
  format: jsonl
  fields:
    input: prompt
    output: response

backend:
  kind: axolotl
  config_file: training/configs/axolotl-mathlib-proof-repair-qwen-1.5b-lora.yaml

hyperparameters:
  learning_rate: 0.0002
  batch_size: 1
  gradient_accumulation: 8
  num_epochs: 2
  warmup_steps: 20
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

checkpoint:
  dir: checkpoints
  save_steps: 50
  keep_last: 3

monitoring:
  log_file: train.log
  progress_format: huggingface
  metrics_to_track:
    - loss
    - eval_loss
    - learning_rate

retry:
  max_attempts: 2
  backoff_seconds: 60
  resume_from_checkpoint: true
