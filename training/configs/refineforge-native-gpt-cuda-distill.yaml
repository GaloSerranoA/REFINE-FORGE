id: refineforge-native-gpt-cuda-distill
description: |
  GPU (CUDA, f32) native GPT with KL self-distillation (anti-forgetting, per "Why
  Fine-Tuning Encourages Hallucinations"). After a 2-step warm-up the student is
  snapshotted into a frozen teacher and the remaining steps add
  lambda*KL(teacher||student) to the SFT loss. Requires --features cuda + an NVIDIA GPU.
base_model:
  name: refineforge-native-gpt-cuda
  source: native
  revision: null
dataset:
  path: production-proof/native-gpt-scale/full-pack
  format: sft_pack
  fields: {}
backend:
  kind: refineforge_native_gpt_cuda
  config_file: null
  command: null
  extra_args: []
  runtime: {}
hyperparameters:
  context_length: 256
  eval_split: heldout
  learning_rate: 0.0006
  n_embed: 128
  n_head: 4
  n_layers: 2
  seed: 7
  steps: 5
  weight_decay: 0.1
  self_distill_lambda: 1.0
  distill_temperature: 2.0
  self_distill_warmup_steps: 2
checkpoint:
  dir: checkpoints
  save_steps: 5
  keep_last: 1
monitoring:
  log_file: train.log
  progress_format: native
  metrics_to_track:
  - train_loss
  - dev_loss
  - target_token_accuracy
  - learning_rate
retry:
  max_attempts: 1
  backoff_seconds: 0
  resume_from_checkpoint: false
