claim_id: REFINEFORGE-TRUST-007
title: "No-sorry policy gate rejects forbidden tokens under policy"
description: |
  Dogfood model+refined claim about the FOUNDATIONAL gate of the framework: the
  no-sorry policy gate that gives every status: proven claim its meaning. The
  Lean model mirrors the ok computation in sorry_gate::check
  (crates/refineforge-cli/src/sorry_gate.rs): the gate accepts iff no enabled
  policy flag has a positive forbidden-token count. It proves a present
  sorry/admit/axiom under its policy is rejected (T1-T3), a clean source passes
  under any policy (T4), and concretely a single sorry under the default policy
  is rejected (T5).

  Honest scope: the Lean proves the gate's boolean DECISION, taking the
  post-comment-strip occurrence counts as given. The word-boundary regexes and
  the comment-stripping that produce those counts are the idealisation boundary
  and are NOT modelled. Human-reviewed on 2026-05-29 (see review block and
  refinement doc section 6), so scope is model+refined and the agent reports
  human-reviewed.

scope: model+refined
status: proven
authors:
  - refineforge

rust_source:
  - path: crates/refineforge-cli/src/sorry_gate.rs
    types:
      - GateResult
    functions:
      - check
      - strip_comments

lean:
  toolchain: leanprover/lean4:v4.29.1
  module: Refineforge.PolicyGate
  file: lean/Refineforge/PolicyGate.lean
  theorems:
    - present_sorry_rejected
    - present_admit_rejected
    - present_axiom_rejected
    - clean_source_accepted
    - default_policy_rejects_one_sorry

policy:
  no_sorry: true
  no_admit: true
  no_axioms_beyond_lean_core: true

review:
  human_operator: "Galo Serrano Abad"
  reviewed_on: "2026-05-29"
  notes: "Human-reviewed 2026-05-29 by Galo Serrano Abad. Verified the Rust ok computation in check matches Lean ok (the three !(flag && count>0) conjuncts) and consciously accepted that the word-boundary regexes + strip_comments lexer are out of scope -- the model proves the verdict given correct counts, not that the lexer counts correctly."
