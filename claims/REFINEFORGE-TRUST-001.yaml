claim_id: REFINEFORGE-TRUST-001
title: "Agent trust-ceiling enforcement never exceeds the ceiling"
description: |
  Dogfood model+refined claim about Refine-Forge's OWN agent trust system.
  The Lean model proves that the trust-ceiling enforcement step never yields a
  trust level ranked above the configured ceiling (T1 safety), returns the
  reported level unchanged when it is already within the ceiling (T2
  faithfulness), and is idempotent (T3). This is the invariant that makes the
  four specialist agents un-spoofable: no reported trust can survive above its
  ceiling.

  Honest scope: Lean proves a property of the model. The refinement argument in
  docs/refinement/REFINEFORGE-TRUST-001.md is the trust-critical bridge to the
  real Rust in crates/refineforge-cli/src/agent/common.rs. Human-reviewed on
  2026-05-29 (see the review block and refinement doc section 6): the Lean model,
  refinement doc, Rust citations, and human review now agree, so the scope is
  model+refined and the agent reports human-reviewed.

scope: model+refined
status: proven
authors:
  - refineforge

rust_source:
  - path: crates/refineforge-cli/src/agent/common.rs
    types:
      - TrustLevel
    functions:
      - trust_rank
      - enforce_trust_ceiling

lean:
  toolchain: leanprover/lean4:v4.29.1
  module: Refineforge.AgentTrust
  file: lean/Refineforge/AgentTrust.lean
  theorems:
    - enforce_never_exceeds_ceiling
    - enforce_keeps_when_within_ceiling
    - enforce_idempotent

policy:
  no_sorry: true
  no_admit: true
  no_axioms_beyond_lean_core: true

review:
  human_operator: "Galo Serrano Abad"
  reviewed_on: "2026-05-29"
  notes: "Human-reviewed 2026-05-29 by Galo Serrano Abad. Verified: (1) the seven TrustLevel variants + trust_rank values match Lean rank; (2) enforce_trust_ceiling's resulting trust level equals Lean enforce; (3) all four agents bound trust via seal_runtime/enforce_trust_ceiling as the final step (refinement doc section 6). The Lean models the RESULTING trust level of enforce_trust_ceiling; its side effects (capped bool, warning) are out of model scope."
