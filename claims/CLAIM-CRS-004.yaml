claim_id: CLAIM-CRS-004
title: "Ethical gate non-bypass"
description: |
  Consciousness-rs safety routing requires allowed actions to pass through the
  same allow decision produced by the gate. This claim verifies the structural
  slice that an action marked allowed cannot contradict the gate result when
  the gate result is the action result.

  Honest scope: this is a formalized routing invariant. It does not prove a
  complete ethics system.

scope: model-only
status: proven
authors:
  - consciousness-rs
  - refineforge

lean:
  toolchain: leanprover/lean4:v4.29.1
  module: Refineforge.Consciousness.Claims
  file: lean/Refineforge/Consciousness/Claims.lean
  theorems:
