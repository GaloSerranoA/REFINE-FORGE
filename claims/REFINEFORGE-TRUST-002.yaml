claim_id: REFINEFORGE-TRUST-002
title: "Operator-identity gate rejects automated and placeholder names"
description: |
  Dogfood model+refined claim about Refine-Forge's OWN anti-spoofing gate. The
  Lean model mirrors the membership check in Rust is_automated_operator
  (crates/refineforge-cli/src/agent/common.rs) -- the function that prevents an
  AI, bot, or placeholder from being recorded as a human approver. It proves:
  any operator whose tokens include a blocked name is rejected (T1); an operator
  with no blocked token is accepted (T2); and concretely, an AI name like
  "claude" is rejected (T3).

  Honest scope: Lean proves a property of the model. The refinement doc bridges
  it to the Rust and discloses the tokenisation idealisation -- the Rust
  lowercases the operator and splits it on non-alphanumeric characters before
  the membership check; the Lean takes the resulting tokens as given.
  Human-reviewed on 2026-05-29 (see the review block and refinement doc section
  6): the Lean model, refinement doc, Rust citation, and human review now agree,
  so the scope is model+refined and the agent reports human-reviewed.

scope: model+refined
status: proven
authors:
  - refineforge

rust_source:
  - path: crates/refineforge-cli/src/agent/common.rs
    functions:
      - is_automated_operator

lean:
  toolchain: leanprover/lean4:v4.29.1
  module: Refineforge.OperatorGate
  file: lean/Refineforge/OperatorGate.lean
  theorems:
    - blocked_token_is_rejected
    - clean_operator_is_accepted
    - ai_name_is_rejected

policy:
  no_sorry: true
  no_admit: true
  no_axioms_beyond_lean_core: true

review:
  human_operator: "Galo Serrano Abad"
  reviewed_on: "2026-05-29"
  notes: "Human-reviewed 2026-05-29 by Galo Serrano Abad. Verified: (1) the Lean blocked list equals the Rust blocked array (15 tokens); (2) the tokenisation idealisation is acceptable; (3) the denylist limitation is acceptable for how human_operator is used. The Lean models the post-tokenisation membership check; the Rust lowercasing + split-on-non-alphanumeric is the idealisation boundary. DENYLIST (15 known tokens), not an exhaustive AI detector -- see refinement doc sections 3 and 5."
