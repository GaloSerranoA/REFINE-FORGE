claim_id: CLAIM-CRS-002
title: "Workspace capacity bound"
description: |
  Consciousness-rs treats global-workspace capacity as an explicit bound on
  selected content. This claim verifies the structural slice that content is
  accepted only when the stated capacity relation holds.

  Honest scope: this is a model-level invariant for the CRS integration
  contract. It does not prove a biological workspace theory.

scope: model-only
status: proven
